<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.3" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#shieldBorder)" stroke-width="4" />

  <!-- Outer Orbiting Polymath Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#27272a" stroke-width="3" stroke-dasharray="8 8" />
  <circle cx="256" cy="76" r="10" fill="#f59e0b" />
  <circle cx="436" cy="256" r="8" fill="#10b981" />
  <circle cx="256" cy="436" r="8" fill="#3b82f6" />
  <circle cx="76" cy="256" r="8" fill="#8b5cf6" />

  <!-- Shield Crest -->
  <path d="M256 120 L370 170 C370 290 256 360 256 385 C256 360 142 290 142 170 Z"
        fill="#18181b"
        stroke="url(#goldGradient)"
        stroke-width="8"
        stroke-linejoin="round"
        filter="url(#shadow)" />

  <!-- Inner Chevron / Monogram 'R' -->
  <path d="M210 200 L210 310 M210 200 L265 200 C285 200 295 212 295 228 C295 244 285 256 265 256 L210 256 M255 256 L298 310"
        fill="none"
        stroke="url(#goldGradient)"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Micro Star / Crown of Level 1000 -->
  <polygon points="256,150 262,165 278,166 266,176 270,192 256,182 242,192 246,176 234,166 250,165" fill="#fef08a" />
</svg>
